<title>Round 5 Connections</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: calm pool water. Soft blue page, rounded white tiles, one blue accent, group bars in fixed colours */
:root{
  --deck:#eaf5f8; --panel:#ffffff; --fg:#123344; --muted:#5a7684; --line:#cfe5ec;
  --tile:#ffffff; --tile-fg:#123344; --accent:#2f86a6; --sel:#2f86a6; --sel-fg:#ffffff; --bad:#c2475a;
  --g-green:#a6d995; --g-green-fg:#1d4410; --g-yellow:#f6dc7a; --g-yellow-fg:#3f3000;
  --g-blue:#a3cff2; --g-blue-fg:#0e3459; --g-purple:#cbbaf3; --g-purple-fg:#33226b;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deck:#0b2230; --panel:#11303f; --fg:#e4f2f6; --muted:#93b3c0; --line:#1d4556;
  --tile:#163c4d; --tile-fg:#e4f2f6; --accent:#6cc0dd; --sel:#6cc0dd; --sel-fg:#0b2230; --bad:#ff8a9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --deck:#0b2230; --panel:#11303f; --fg:#e4f2f6; --muted:#93b3c0; --line:#1d4556;
  --tile:#163c4d; --tile-fg:#e4f2f6; --accent:#6cc0dd; --sel:#6cc0dd; --sel-fg:#0b2230; --bad:#ff8a9a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--deck);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;margin:0}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 4px}
.band-in{max-width:520px;margin:0 auto}
.eyebrow{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0;color:var(--accent)}
h1{font-weight:800;font-size:38px;line-height:1.05;margin:2px 0 0}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lede{margin:0}
label{font-weight:700}
input{font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--deck);color:var(--fg);width:100%}
button{font-family:var(--font);font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--sel-fg)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.team{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.team b{font-weight:800;font-size:20px}
.lives{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.floats{display:flex;gap:6px}
.float{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.float.used{background:var(--line)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1.2/1;max-width:100%;border:1px solid var(--line);border-radius:16px;background:var(--tile);color:var(--tile-fg);
  font-family:var(--font);font-weight:700;font-size:clamp(12px,3.6vw,17px);
  display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer;word-break:break-word;line-height:1.15;transition:transform .12s,background .12s}
.tile.sel{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.tile:active{transform:scale(.95)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.found{grid-column:1/-1;border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px;animation:pop .3s ease-out}
.found small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.found span{font-weight:800;font-size:17px}
.g0{background:var(--g-green);color:var(--g-green-fg)}
.g1{background:var(--g-yellow);color:var(--g-yellow-fg)}
.g2{background:var(--g-blue);color:var(--g-blue-fg)}
.g3{background:var(--g-purple);color:var(--g-purple-fg)}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake,.found{animation:none}.tile{transition:none}}
.status{text-align:center;font-weight:800;font-size:18px;min-height:1.4em;margin:0}
.status.good{color:var(--accent)}.status.bad{color:var(--bad)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.done{text-align:center}
.done h2{font-weight:800;font-size:24px;margin:0}
.done p{margin:0;color:var(--muted)}
.rules{color:var(--muted);font-size:14px;margin:0;text-align:center}
</style>

<header class="band">
  <div class="band-in">
    <p class="eyebrow">Pub quiz · Round 5</p>
    <h1>Connections</h1>
  </div>
</header>

<main>
<div class="wrap">
  <section id="game" class="wrap">
    <p class="lede">Sort the 16 words into four groups of four. Four mistakes and the board locks.</p>
    <div class="lives"><span>Mistakes left</span><span id="dots" class="floats" aria-label="Mistakes left"></span></div>
    <div id="board" class="board" role="group" aria-label="Connections board"></div>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="controls" class="controls">
      <button id="shuffleBtn">Shuffle</button>
      <button id="clearBtn">Deselect</button>
      <button id="submitBtn" class="primary" disabled>Submit</button>
    </div>
    <div id="done" class="card done" hidden>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
    </div>
    <p class="rules">Write each group on your answer sheet, plus what links it. The links aren't shown here, as that's your second point.</p>
  </section>
</div>
</main>

<script>
const GROUPS=[
  ["Handlebar","Chevron","Pencil","Goatee"],
  ["Breast","Thigh","Wing","Drumstick"],
  ["Back","Free","Under","Second"],
  ["Butterfly","Jamboree","Honeymoon","Beanstalk"]
];
const START=["Back","Jamboree","Chevron","Wing","Honeymoon","Free","Thigh","Pencil","Under","Butterfly","Handlebar","Breast","Goatee","Drumstick","Beanstalk","Second"];
const KEY="r5conn-v4";
let S=null, sel=[];
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setStatus(t,c){const s=$("status");s.textContent=t;s.className="status"+(c?" "+c:"")}
function begin(){S={words:START.slice(),found:[],mistakes:0,tried:[]};save();render()}
function render(){
  const d=$("dots");d.innerHTML="";
  for(let i=0;i<4;i++){const s=document.createElement("span");s.className="float"+(i>=4-S.mistakes?" used":"");d.appendChild(s)}
  const b=$("board");b.innerHTML="";
  S.found.forEach(gi=>{
    const f=document.createElement("div");f.className="found g"+gi;
    f.innerHTML=`<small>Group found</small><span>${GROUPS[gi].join(", ")}</span>`;b.appendChild(f);
  });
  const over=S.mistakes>=4||S.found.length===4;
  S.words.forEach(w=>{
    const t=document.createElement("button");t.className="tile"+(sel.includes(w)?" sel":"");t.textContent=w;
    t.setAttribute("aria-pressed",sel.includes(w));t.disabled=over;
    t.onclick=()=>{setStatus("");if(sel.includes(w))sel=sel.filter(x=>x!==w);else if(sel.length<4)sel.push(w);render()};
    b.appendChild(t);
  });
  $("submitBtn").disabled=sel.length!==4||over;
  $("controls").hidden=over;
  $("done").hidden=!over;
  if(over){
    if(S.found.length===4){$("doneTitle").textContent="Board complete";$("doneText").textContent=`All four groups with ${S.mistakes} mistake${S.mistakes===1?"":"s"}. Write them on your sheet and add the links.`}
    else{$("doneTitle").textContent="Out of guesses";$("doneText").textContent=`You found ${S.found.length} of 4 groups. Write those on your sheet, and you can still guess the links.`}
  }
}
function submit(){
  const key=sel.slice().sort().join("|");
  if(S.tried.includes(key)){setStatus("Already tried that","bad");return}
  const gi=GROUPS.findIndex(g=>sel.every(w=>g.includes(w)));
  if(gi>=0){S.found.push(gi);S.words=S.words.filter(w=>!sel.includes(w));sel=[];setStatus("Correct","good")}
  else{
    S.tried.push(key);S.mistakes++;
    const best=Math.max(...GROUPS.map(g=>sel.filter(w=>g.includes(w)).length));
    setStatus(best===3?"One away":"Not a group","bad");
    const b=$("board");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
  }
  save();render();
}
$("submitBtn").onclick=submit;
$("clearBtn").onclick=()=>{sel=[];render()};
$("shuffleBtn").onclick=()=>{for(let i=S.words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.words[i],S.words[j]]=[S.words[j],S.words[i]]}save();render()};
if(location.hash==="#reset"){try{localStorage.removeItem(KEY)}catch(e){}}
const prev=load();
if(prev&&Array.isArray(prev.words)){S=prev;render()}else begin();
</script>
